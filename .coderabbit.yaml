# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

early_access: false

reviews:
  profile: "assertive"

  request_changes_workflow: true

  high_level_summary: true
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

chat:
  auto_reply: true

issue_enrichment:
  auto_enrich:
    enabled: true
