<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,follow">
<title>Cattr developer guides moved</title>
<meta http-equiv="refresh" content="5;url=https://github.com/cattr-app/server-application/blob/main/docs/developer/README.md">
</head>
<body>
<p>Developer guides have moved to the <a id="guide" href="https://github.com/cattr-app/server-application/blob/main/docs/developer/README.md">Cattr repository</a>.</p>
<script>
(function () {
    'use strict';
    const routes = {"api/modules":"modules.md","api/context":"context/README.md","api/context/crud":"context/crud.md","api/context/grid":"context/grid.md","api/context/localization":"context/localization.md","api/context/navbar":"context/navbar.md","api/context/routing":"context/routing.md","api/context/routing/guard":"context/routing/guard.md","api/context/settings":"context/settings.md","api/context/vuex":"context/vuex.md","api/module-loader-interceptor":"module-loader-interceptor.md","api/service-class":"service-class.md","api/context/crud/custom-fields":"context/crud.md"};
    const base = 'https://github.com/cattr-app/server-application/blob/main/docs/developer/';
    const hash = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));
    const path = hash.split('?')[0].replace(/^\/+|\/+$/g, '');
    const match = /^(en|ru)(?:\/(.*))?$/.exec(path);
    const lang = match && match[1] === 'ru' ? 'ru' : 'en';
    const route = match && match[2] ? match[2].replace(/\/+$/, '') : '';
    const file = Object.prototype.hasOwnProperty.call(routes, route) ? routes[route] : 'README.md';
    const sectionRoot = 'frontend';
    const target = base + lang + '/' + sectionRoot + '/' + file;
    document.getElementById('guide').href = target;
    window.location.replace(target);
}());
</script>
</body></html>
