pages:
  stage: deploy
  image: node:24-alpine
  environment:
    name: production
    url: https://frontend.docs.cattr.app
  only:
    - tags
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter cattr-docs-frontend run sitemap
    - rm -rf public
    - mkdir -p public
    - cp -R docs/frontend/docs/. public/
  artifacts:
    paths:
      - public
