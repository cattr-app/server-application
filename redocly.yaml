# Redocly CLI configuration for the API reference (`pnpm build:pages`, .github/workflows/pages.yml).
extends:
  - recommended

rules:
  # The public status-style endpoints (`GET /status`, `POST /roles/list`) have no endpoint-specific 4xx response.
  operation-4xx-response: off
  # The deprecated `POST /auth/refresh` always fails with 400 and has no successful response (the only such operation).
  operation-2xx-response: off

# Redoc options. They must live under the top-level `openapi:` key (`theme.openapi` is ignored by CLI 2.x).
openapi:
  hideDownloadButton: false
  theme:
    logo:
      maxHeight: 48px
      maxWidth: 48px
      gutter: 12px
