{{- if and .Values.mysql.enabled (not .Values.mysql.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cattr.mysql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.mysql.labels" . | nindent 4 }}
  annotations:
    # The database is never deleted by `helm uninstall` or Argo CD pruning.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
    {{- with (include "cattr.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.mysql.persistence.accessModes | nindent 4 }}
  {{- with (include "cattr.storageClass" (dict "persistence" .Values.mysql.persistence "global" .Values.global)) }}
  {{- . | nindent 2 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
{{- end }}
