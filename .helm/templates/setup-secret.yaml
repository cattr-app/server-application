{{- /*
Pre-install/pre-upgrade hooks run before the chart Secret exists (fresh
install), so the setup Job reads chart-managed values from this short-lived
hook Secret. Same data as the chart Secret plus the administrator password.
Deleted after a successful setup; after a failed one it is kept for debugging
and replaced on the next attempt.
*/}}
{{- $data := include "cattr.secretData" . }}
{{- $adminPassword := and (include "cattr.setup.provision" .) .Values.setup.admin.password (not .Values.setup.admin.existingSecret) }}
{{- if or $data $adminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cattr.setupSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.componentLabels" (dict "context" . "component" "setup") | nindent 4 }}
  annotations:
    {{- if .Values.setup.hook }}
    helm.sh/hook: {{ include "cattr.setup.hookEvents" . }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- end }}
    {{- with (include "cattr.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- with $data }}
  {{- . | trim | nindent 2 }}
  {{- end }}
  {{- if $adminPassword }}
  APP_ADMIN_PASSWORD: {{ .Values.setup.admin.password | toString | b64enc | quote }}
  {{- end }}
{{- end }}
