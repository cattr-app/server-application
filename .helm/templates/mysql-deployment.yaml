{{- if .Values.mysql.enabled }}
{{- /*
Built-in MySQL: single-node demo/evaluation database. Name and selector are
kept from chart 0.1.x so existing demo installs upgrade in place.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cattr.mysql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.mysql.labels" . | nindent 4 }}
  {{- with (include "cattr.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cattr.mysql.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "cattr.mysql.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include "cattr.secretChecksum" . | quote }}
    spec:
      {{- with (include "cattr.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.mysql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: {{ include "cattr.mysql.image" . }}
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            {{- $sec := dict "context" . "chartSecret" (include "cattr.secretName" .) }}
            {{- include "cattr.secretEnv" (merge (dict "var" "MYSQL_ROOT_PASSWORD") $sec) | nindent 12 }}
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  {{- include "cattr.secretRef" (merge (dict "var" "DB_USERNAME") $sec) | nindent 18 }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "cattr.secretRef" (merge (dict "var" "DB_PASSWORD") $sec) | nindent 18 }}
          args:
            - --log-bin-trust-function-creators=1
          {{- with .Values.mysql.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /var/run/mysqld
            - name: tmp
              mountPath: /tmp
          {{- with .Values.mysql.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            tcpSocket:
              port: mysql
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.mysql.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.mysql.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.mysql.persistence.existingClaim | default (include "cattr.mysql.fullname" .) }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
