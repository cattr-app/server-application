{{- $data := include "cattr.secretData" . }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cattr.secretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`: losing APP_KEY makes encrypted data unreadable.
    helm.sh/resource-policy: keep
    {{- with (include "cattr.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- $data | trim | nindent 2 }}
{{- end }}
