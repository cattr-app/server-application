{{- if eq .Values.storage.type "pvc" }}
{{- /*
pvc mode: web, queue and scheduler are containers of ONE Pod sharing the RWO
volume. Name and selector are kept from chart 0.1.x (selectors are immutable).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cattr.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.labels" . | nindent 4 }}
  {{- with (include "cattr.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
    # Chart 0.1.x used RollingUpdate; null clears the server-defaulted field on upgrade.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "cattr.selectorLabels" . | nindent 6 }}
  template:
    {{- include "cattr.podTemplate" (dict "context" . "roles" (list "web" "queue" "scheduler") "selector" (include "cattr.selectorLabels" .) "extraAnnotations" (dict)) | nindent 4 }}
{{- end }}
