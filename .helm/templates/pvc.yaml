{{- if and (eq .Values.storage.type "pvc") (not .Values.storage.pvc.existingClaim) }}
{{- /*
Shared application data in pvc mode (subPaths): storage/app/screenshots,
storage/app/attachments, storage/app/tmp, storage/app/public/reports and
storage/framework/cache. Kept on `helm uninstall` and by Argo CD pruning.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cattr.fullname" . }}-storage
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
    {{- with (include "cattr.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- with .Values.storage.pvc.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.storage.pvc.accessModes | nindent 4 }}
  {{- with (include "cattr.storageClass" (dict "persistence" .Values.storage.pvc "global" .Values.global)) }}
  {{- . | nindent 2 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.pvc.size }}
{{- end }}
