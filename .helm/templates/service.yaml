apiVersion: v1
kind: Service
metadata:
  name: {{ include "cattr.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.labels" . | nindent 4 }}
  {{- $annotations := merge (dict) (.Values.service.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Caddy: HTTP, static files and the Reverb WebSocket upgrade on /app/*.
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cattr.webSelectorLabels" . | nindent 4 }}
{{- if eq .Values.storage.type "s3" }}
---
# Reverb for queue/scheduler Pods to broadcast to (s3 mode only; in pvc mode
# they share the Pod with web and use 127.0.0.1).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cattr.reverbServiceName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cattr.componentLabels" (dict "context" . "component" "reverb") | nindent 4 }}
  {{- with (include "cattr.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: reverb
      protocol: TCP
      name: reverb
  selector:
    {{- include "cattr.webSelectorLabels" . | nindent 4 }}
{{- end }}
