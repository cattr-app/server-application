# CI render: every credential from caller-managed Secrets, existing PVC,
# pinned image digest. No chart-managed Secret is rendered.
image:
  digest: sha256:0e26a5d03d4641f60e1981cb37bb0e620c40bc8798e4ef544b433e62aee7ac38
cattr:
  appUrl: https://cattr.example.com
  existingSecret: cattr-app
database:
  host: mysql.db.svc.cluster.local
  existingSecret: cattr-db
  existingSecretKeys:
    username: user
    password: password
redis:
  enabled: true
  host: redis.cache.svc.cluster.local
  existingSecret: cattr-redis
storage:
  pvc:
    existingClaim: cattr-files
setup:
  admin:
    email: admin@example.com
    existingSecret: cattr-admin
