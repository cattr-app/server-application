apiVersion: v2
name: server
description: Cattr is an open-source time-tracking solution for teams
type: application
# The chart is versioned independently of the application. Chart 0.2.x targets
# the Cattr 4.1 runtime image (Caddy + Octane + Reverb + Pebble, explicit roles).
version: 0.2.0
appVersion: "4.1.1"
kubeVersion: ">=1.27.0-0"
keywords:
  - cattr
  - time-tracking
  - productivity
  - management
  - laravel
home: https://cattr.app
icon: https://raw.githubusercontent.com/cattr-app/server-application/main/public/images/logo.svg
maintainers:
  - name: Alex
    email: inbox@alexv-pro.ru
  - name: Cattr Team
    email: hi@cattr.app
sources:
  - https://github.com/cattr-app/server-application
annotations:
  artifacthub.io/license: SSPL-1.0
  # Keep the image tag equal to appVersion (checked by ci/release-metadata.sh).
  artifacthub.io/images: |
    - name: cattr
      image: ghcr.io/cattr-app/server:4.1.1
  artifacthub.io/links: |
    - name: Documentation
      url: https://cattr.app/manual
    - name: Source
      url: https://github.com/cattr-app/server-application
