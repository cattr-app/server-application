worker_processes auto;
pcre_jit on;

# Rootless runtime: keep all mutable nginx state out of /run and /var/log.
pid /tmp/nginx.pid;

include /etc/nginx/modules/*.conf;

worker_rlimit_nofile 64000;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 2000;
    reset_timedout_connection on;

    types_hash_max_size 2048;
    client_max_body_size 512m;

    proxy_buffer_size 128k;
    proxy_buffers 16 128k;
    proxy_busy_buffers_size 128k;

    server_names_hash_bucket_size 64;
    server_name_in_redirect off;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # All temporary files must remain writable by UID/GID 10000.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    gzip on;
    gzip_disable "msie6";
    gzip_min_length 20;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/css text/x-component application/x-javascript application/javascript
               text/javascript text/x-js text/richtext image/svg+xml text/plain text/xsd
               text/xsl text/xml image/bmp application/java application/msword
               application/vnd.ms-fontobject application/x-msdownload image/x-icon image/webp
               application/json application/vnd.ms-access application/vnd.ms-project
               application/x-font-otf application/vnd.ms-opentype
               application/vnd.oasis.opendocument.database
               application/vnd.oasis.opendocument.chart
               application/vnd.oasis.opendocument.formula
               application/vnd.oasis.opendocument.graphics
               application/vnd.oasis.opendocument.spreadsheet
               application/vnd.oasis.opendocument.text audio/ogg application/pdf
               application/vnd.ms-powerpoint application/x-shockwave-flash image/tiff
               application/x-font-ttf audio/wav application/vnd.ms-write application/font-woff
               application/font-woff2 application/vnd.ms-excel;

    open_file_cache max=200000 inactive=3600s;
    open_file_cache_valid 3600s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/app.conf;
}
