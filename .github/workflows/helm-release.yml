name: Helm OCI release

on:
  push:
    tags:
      - 'helm/v*'

permissions:
  contents: read

concurrency:
  group: helm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      OCI_REPOSITORY: ghcr.io/cattr-app/helm/server
      OCI_NAMESPACE: oci://ghcr.io/cattr-app/helm
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Resolve versions and validate branch
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .helm/ci/release-metadata.sh "$RELEASE_TAG"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Helm releases must point to commits reachable from main"
            exit 1
          }

      - name: Lint and validate chart
        uses: docker://alpine/k8s@sha256:d50424976a0a888d2531f13035dce45c004ec2b6f877f233005ba35c0d61be5d # 1.34.12
        with:
          entrypoint: sh
          args: .helm/ci/check.sh

      # A re-run of a failed release reuses the archive packaged by the first attempt:
      # a fresh `helm package` is not byte-identical (it records timestamps), so it could
      # not be compared with what was already pushed.
      - name: Restore archive from an earlier attempt
        id: restore
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart-archive
          path: dist

      # Validate the image the release will actually reference: on a re-run that is
      # the appVersion of the restored archive, not a newer release that appeared since.
      - name: Validate application image
        env:
          VERSION: ${{ steps.meta.outputs.chart_version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          ARCHIVE_RESTORED: ${{ steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          image_tag="$APP_VERSION"
          if [ "$ARCHIVE_RESTORED" = "true" ]; then
            image_tag="$(helm show chart "dist/server-$VERSION.tgz" | awk '/^appVersion:/ {gsub(/["\047]/, "", $2); print $2}')"
          fi
          [ -n "$image_tag" ] || { echo "::error::Cannot determine the application version"; exit 1; }
          crane manifest "ghcr.io/cattr-app/server:$image_tag" >/dev/null || {
            echo "::error::Referenced application image is not available: $image_tag"
            exit 1
          }

      - name: Package chart
        id: package
        if: steps.restore.outcome != 'success'
        env:
          VERSION: ${{ steps.meta.outputs.chart_version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # Chart.yaml holds the 0.0.0 placeholder; keep the Artifact Hub image tag in sync.
          sed -i "s|ghcr.io/cattr-app/server:0.0.0|ghcr.io/cattr-app/server:$APP_VERSION|" .helm/Chart.yaml
          mkdir -p dist
          helm package .helm --version "$version" --app-version "$APP_VERSION" --destination dist
          test -f "dist/server-$version.tgz"
          sha256sum "dist/server-$version.tgz" | tee dist/SHA256SUMS

      - name: Preserve packaged archive
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: helm-chart-archive
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable OCI chart and verify pull
        env:
          VERSION: ${{ steps.meta.outputs.chart_version }}
          ARCHIVE_RESTORED: ${{ steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # OCI tags cannot contain "+"; helm stores SemVer build metadata with "_".
          oci_tag="${version//+/_}"
          sha256sum -c dist/SHA256SUMS
          # No overwrite: previously published artifacts must remain immutable.
          # Fail closed: only an explicit "not found" from the registry allows the push;
          # any other lookup failure (timeout, authorization) aborts the release.
          # The one exception is a re-run that restored the archive pushed by an earlier
          # attempt of this run: then nothing is pushed and the published chart is only
          # verified against that archive.
          if lookup="$(crane manifest "$OCI_REPOSITORY:$oci_tag" 2>&1)"; then
            if [ "$ARCHIVE_RESTORED" != "true" ]; then
              echo "::error::Helm chart $version is already published; refusing overwrite"
              exit 1
            fi
            echo "Helm chart $version was pushed by an earlier attempt; verifying without pushing"
          elif ! printf '%s' "$lookup" | grep -qE ': (GET|HEAD) [^ ]+: (MANIFEST_UNKNOWN|NAME_UNKNOWN): |: (GET|HEAD) [^ ]+: unexpected status code 404 Not Found'; then
            echo "::error::Cannot determine whether Helm chart $version exists: $lookup"
            exit 1
          else
            helm push "dist/server-$version.tgz" "$OCI_NAMESPACE"
          fi
          mkdir -p pulled
          helm pull "oci://$OCI_REPOSITORY" --version "$version" --destination pulled
          cmp "dist/server-$version.tgz" "pulled/server-$version.tgz"
          helm show chart "oci://$OCI_REPOSITORY" --version "$version"
          crane digest "$OCI_REPOSITORY:$oci_tag" | tee dist/OCI-DIGEST
