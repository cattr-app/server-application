name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: PHPUnit
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69  # 8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: cattr
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cattr
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, openssl, pdo_mysql, simplexml, tokenizer, xml, zip
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=InitialSeeder --force --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-progress --coverage-clover coverage/clover.xml

      # Advisory: coverage is reported to Codecov but never fails this job.
      # CODECOV_TOKEN is not available to fork PRs; Codecov accepts tokenless
      # uploads for public repositories in that case.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml
          disable_search: true
          flags: phpunit
          fail_ci_if_error: false

  phpcs:
    name: PHP_CodeSniffer (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # On pull_request the checked-out commit is the test merge commit;
          # its first parent is the base branch, which gives the PR diff.
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, json, mbstring, openssl, pdo_mysql, simplexml, tokenizer, xml, zip
          coverage: none
          tools: composer:v2, cs2pr:1.8.7

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # Advisory until the existing baseline is cleaned up: violations are
      # reported as warning annotations on PRs (changed files only) and as a
      # summary on main, but never fail the job. Only a failure to run
      # PHP_CodeSniffer itself fails the job.
      - name: Run PHP_CodeSniffer
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          check_exit_code() {
            # PHP_CodeSniffer 4 exit codes are a bitmask: 1 and 2 mean that
            # violations were found; anything else is a processing error.
            if (( $1 & ~3 )); then
              echo "::error::PHP_CodeSniffer failed to run (exit code $1)"
              exit "$1"
            fi
          }

          if [[ "${EVENT_NAME}" != pull_request ]]; then
            rc=0
            vendor/bin/phpcs -q --report=summary --report-file=phpcs-summary.txt || rc=$?
            check_exit_code "${rc}"
            cat phpcs-summary.txt
            {
              echo '### PHP_CodeSniffer baseline'
              echo '```'
              tail -n 6 phpcs-summary.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Keep in sync with the <file> and <exclude-pattern> entries in phpcs.xml.
          changed="$(
            git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- \
              'app/*.php' \
              'bootstrap/*.php' \
              'config/*.php' \
              'database/*.php' \
              'routes/*.php' \
              'tests/*.php' \
              ':(exclude)bootstrap/cache/*' \
              ':(exclude)bootstrap/autoload.php' \
              ':(exclude)*/migrations/*' \
              ':(exclude)*/seeds/*' \
              ':(exclude)*.blade.php'
          )"

          if [[ -z "${changed}" ]]; then
            echo 'No PHP files checked by phpcs.xml were changed.' | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          mapfile -t files <<< "${changed}"
          echo "Checking ${#files[@]} changed file(s)."

          rc=0
          vendor/bin/phpcs -q \
            --report-full \
            --report-summary=phpcs-summary.txt \
            --report-checkstyle=phpcs-checkstyle.xml \
            -- "${files[@]}" || rc=$?
          check_exit_code "${rc}"

          cs2pr --graceful-warnings --errors-as-warnings phpcs-checkstyle.xml

          {
            echo '### PHP_CodeSniffer (changed files)'
            echo '```'
            cat phpcs-summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run JavaScript tests
        run: pnpm test

      - name: Production build
        run: pnpm prod
