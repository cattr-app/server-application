name: Scorecard

# OpenSSF Scorecard, based on the official example
# (ossf/scorecard-action examples/scorecard.yml). publish_results imposes
# restrictions on this job: no top-level env/defaults, no containers or
# services, and only allow-listed actions in its steps.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write  # Upload SARIF to GitHub code scanning.
      id-token: write  # Sign results published to api.scorecard.dev.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: results.sarif
