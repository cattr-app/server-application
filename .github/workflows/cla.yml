name: CLA

# zizmor flags pull_request_target and issue_comment as dangerous triggers;
# both are required here and suppressed inline below:
# - pull_request_target: CLA status must be posted on fork PRs, which only
#   get the CATTR_CLA_BOT_* secrets under this trigger;
# - issue_comment: the /cla-check, /cla-sign and /cla-claim commands.
# The workflow is safe with them: it never checks out or runs PR code, has
# no `run:` steps and no expressions built from PR/comment content (comment
# bodies are only compared in job `if:` conditions), every job only calls a
# cattr-app/cla-actions reusable workflow, and GITHUB_TOKEN is limited to
# `contents: read`. Keep it that way when editing this file.
# Note the real privilege: the forwarded CATTR_CLA_BOT_* / CATTR_CLA_REGISTRY_*
# secrets let the called workflows mint GitHub App tokens with write access
# (sign.yml@v1: issues, pull-requests and checks on this repository, contents
# on cla-registry). `@v1` is a moving tag of our own repository, so every
# change to cattr-app/cla-actions must be reviewed as carefully as a change
# to this workflow.
on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] see above
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  issue_comment:  # zizmor: ignore[dangerous-triggers] see above
    types:
      - created

  push:
    paths:
      - CLA.md

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request_target'
    uses: cattr-app/cla-actions/.github/workflows/check.yml@v1
    secrets:
      CATTR_CLA_BOT_PRIVATE_KEY: ${{ secrets.CATTR_CLA_BOT_PRIVATE_KEY }}

  check-comment:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/cla-check'
    uses: cattr-app/cla-actions/.github/workflows/check.yml@v1
    secrets:
      CATTR_CLA_BOT_PRIVATE_KEY: ${{ secrets.CATTR_CLA_BOT_PRIVATE_KEY }}

  sign:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cla-sign')
    uses: cattr-app/cla-actions/.github/workflows/sign.yml@v1
    secrets:
      CATTR_CLA_BOT_PRIVATE_KEY: ${{ secrets.CATTR_CLA_BOT_PRIVATE_KEY }}
      CATTR_CLA_REGISTRY_PRIVATE_KEY: ${{ secrets.CATTR_CLA_REGISTRY_PRIVATE_KEY }}

  claim:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/cla-claim')
    uses: cattr-app/cla-actions/.github/workflows/claim.yml@v1
    secrets:
      CATTR_CLA_BOT_PRIVATE_KEY: ${{ secrets.CATTR_CLA_BOT_PRIVATE_KEY }}
      CATTR_CLA_REGISTRY_PRIVATE_KEY: ${{ secrets.CATTR_CLA_REGISTRY_PRIVATE_KEY }}

  sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref_name == github.event.repository.default_branch
      )
    uses: cattr-app/cla-actions/.github/workflows/sync.yml@v1
    secrets:
      CATTR_CLA_REGISTRY_PRIVATE_KEY: ${{ secrets.CATTR_CLA_REGISTRY_PRIVATE_KEY }}
