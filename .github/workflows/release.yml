name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: ghcr.io/cattr-app

  APP_IMAGE: server
  RUNTIME_IMAGE: ghcr.io/cattr-app/server-runtime

  RUNTIME_CONFIG: build/base/runtime/apko.yaml
  BUILDER_CONFIG: build/base/builder/apko.yaml
  COREPACK_CONFIG: build/packages/corepack.yml

  IMAGE_BUILD_REVISION: '1'

jobs:
  runtime-images:
    name: Prepare runtime images
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: ghcr.io/wolfi-dev/sdk:latest
      options: --privileged

    defaults:
      run:
        shell: bash

    outputs:
      image: ${{ steps.meta.outputs.image }}
      runtime_tag: ${{ steps.meta.outputs.runtime_tag }}
      builder_tag: ${{ steps.meta.outputs.builder_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.22.1

      - name: Show build tool versions
        run: |
          set -euo pipefail

          apko version
          melange version
          crane version

      - name: Calculate runtime image tags
        id: meta
        run: |
          set -euo pipefail

          for file in \
            "${RUNTIME_CONFIG}" \
            "${BUILDER_CONFIG}" \
            "${COREPACK_CONFIG}"
          do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Required build configuration not found: ${file}"
              exit 1
            fi
          done

          runtime_files_hash="${{ hashFiles(
            'build/base/runtime/**',
            'build/base/rebuild'
          ) }}"

          builder_files_hash="${{ hashFiles(
            'build/base/builder/**',
            'build/packages/corepack.yml',
            'build/base/rebuild'
          ) }}"

          if [[ -z "${runtime_files_hash}" ]]; then
            echo "::error::Unable to calculate runtime configuration hash"
            exit 1
          fi

          if [[ -z "${builder_files_hash}" ]]; then
            echo "::error::Unable to calculate builder configuration hash"
            exit 1
          fi

          # apko/melange versions are part of the image identity because
          # changing the build tooling may change the resulting image.
          apko_version="$(apko version | tr '\n' ' ')"
          melange_version="$(melange version | tr '\n' ' ')"

          runtime_hash="$(
            printf '%s\n%s\n%s\n' \
              "${IMAGE_BUILD_REVISION}" \
              "${apko_version}" \
              "${runtime_files_hash}" |
              sha256sum |
              cut -d' ' -f1
          )"

          builder_hash="$(
            printf '%s\n%s\n%s\n%s\n' \
              "${IMAGE_BUILD_REVISION}" \
              "${apko_version}" \
              "${melange_version}" \
              "${builder_files_hash}" |
              sha256sum |
              cut -d' ' -f1
          )"

          runtime_tag="runtime-${runtime_hash}"
          builder_tag="builder-${builder_hash}"

          echo "image=${RUNTIME_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "runtime_tag=${runtime_tag}" >> "${GITHUB_OUTPUT}"
          echo "builder_tag=${builder_tag}" >> "${GITHUB_OUTPUT}"

          echo "Runtime image:"
          echo "  ${RUNTIME_IMAGE}:${runtime_tag}"

          echo "Builder image:"
          echo "  ${RUNTIME_IMAGE}:${builder_tag}"

      - name: Check existing runtime images
        id: check
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
        run: |
          set -euo pipefail

          if crane manifest "${RUNTIME_IMAGE}:${RUNTIME_TAG}" >/dev/null 2>&1; then
            echo "Runtime image already exists."
            echo "runtime_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Runtime image does not exist."
            echo "runtime_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if crane manifest "${RUNTIME_IMAGE}:${BUILDER_TAG}" >/dev/null 2>&1; then
            echo "Builder image already exists."
            echo "builder_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Builder image does not exist."
            echo "builder_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Corepack APK repository
        if: steps.check.outputs.builder_exists != 'true'
        env:
          MELANGE_PRIVATE_KEY: ${{ runner.temp }}/melange.rsa
          PACKAGE_REPOSITORY: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail

          rm -rf "${PACKAGE_REPOSITORY}"

          rm -f \
            "${MELANGE_PRIVATE_KEY}" \
            "${MELANGE_PRIVATE_KEY}.pub"

          melange keygen "${MELANGE_PRIVATE_KEY}"

          melange build \
            "${COREPACK_CONFIG}" \
            --runner bubblewrap \
            --arch x86_64 \
            --arch aarch64 \
            --arch armv7 \
            --arch s390x \
            --out-dir "${PACKAGE_REPOSITORY}" \
            --signing-key "${MELANGE_PRIVATE_KEY}" \
            --namespace cattr

          echo "Generated APK repository:"

          find "${PACKAGE_REPOSITORY}" \
            -maxdepth 2 \
            -type f \
            -print

      # setup-crane has already authenticated crane to GHCR using github.token.
      # apko can use the same standard registry credentials.
      - name: Build and publish runtime image
        if: steps.check.outputs.runtime_exists != 'true'
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
        run: |
          set -euo pipefail

          echo "Publishing ${RUNTIME_IMAGE}:${RUNTIME_TAG}"

          apko publish \
            "${RUNTIME_CONFIG}" \
            "${RUNTIME_IMAGE}:${RUNTIME_TAG}"

          crane manifest \
            "${RUNTIME_IMAGE}:${RUNTIME_TAG}" \
            >/dev/null

      - name: Build and publish builder image
        if: steps.check.outputs.builder_exists != 'true'
        env:
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
          MELANGE_PUBLIC_KEY: ${{ runner.temp }}/melange.rsa.pub
          PACKAGE_REPOSITORY: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail

          echo "Publishing ${RUNTIME_IMAGE}:${BUILDER_TAG}"

          apko publish \
            --repository-append "${PACKAGE_REPOSITORY}" \
            --keyring-append "${MELANGE_PUBLIC_KEY}" \
            "${BUILDER_CONFIG}" \
            "${RUNTIME_IMAGE}:${BUILDER_TAG}"

          crane manifest \
            "${RUNTIME_IMAGE}:${BUILDER_TAG}" \
            >/dev/null

      - name: Update runtime-latest
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
        run: |
          set -euo pipefail

          crane tag \
            "${RUNTIME_IMAGE}:${RUNTIME_TAG}" \
            runtime-latest

      - name: Update builder-latest
        env:
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
        run: |
          set -euo pipefail

          crane tag \
            "${RUNTIME_IMAGE}:${BUILDER_TAG}" \
            builder-latest


  application:
    name: Build server
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    needs:
      - runtime-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show container tooling versions
        shell: bash
        run: |
          set -euo pipefail

          buildah --version
          podman --version

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"

          if [[ -z "${version}" ]]; then
            echo "::error::Unable to determine application version"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${GITHUB_REF_NAME}"
          echo "Application version: ${version}"

      - name: Build Cattr server
        id: build
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          context: .

          containerfiles: |
            ./Dockerfile

          image: ${{ env.APP_IMAGE }}

          tags: |
            ${{ github.ref_name }}
            latest

          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

            BUILDER_BASE_IMAGE=${{ needs.runtime-images.outputs.image }}
            BUILDER_BASE_IMAGE_TAG=${{ needs.runtime-images.outputs.builder_tag }}

            RUNTIME_BASE_IMAGE=${{ needs.runtime-images.outputs.image }}
            RUNTIME_BASE_IMAGE_TAG=${{ needs.runtime-images.outputs.runtime_tag }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

          layers: true

      - name: Push Cattr server
        id: push
        uses: redhat-actions/push-to-registry@v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

          registry: ${{ env.REGISTRY_NAMESPACE }}

          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Print published images
        shell: bash
        env:
          REGISTRY_PATHS: ${{ steps.push.outputs.registry-paths }}
        run: |
          set -euo pipefail

          echo "Published:"
          echo "${REGISTRY_PATHS}"
