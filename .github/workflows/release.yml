name: Image building

on:
  push:
    tags:
      - 'v*'

# Write permissions are granted per job, only where images are published.
permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY_NAMESPACE: ghcr.io/cattr-app

  APP_IMAGE: server
  RUNTIME_IMAGE: ghcr.io/cattr-app/server-runtime

  RUNTIME_CONFIG: build/base/runtime/apko.yaml
  BUILDER_CONFIG: build/base/builder/apko.yaml
  PHP_CONFIG: build/packages/php83.yaml
  CADDY_CONFIG: build/packages/caddy.yaml
  NODEJS_CONFIG: build/packages/nodejs-24.yaml
  PEBBLE_CONFIG: build/packages/pebble.yaml
  COMPOSER_CONFIG: build/packages/composer.yaml
  COREPACK_CONFIG: build/packages/corepack.yaml

  # Increment when the base-image build process itself changes in a way
  # that should invalidate previously built immutable images, or to force a
  # clean republish after a registry integrity failure.
  IMAGE_BUILD_REVISION: '7'

  # OCI image metadata.
  #
  # org.opencontainers.image.* keys are OCI annotations. apko also mirrors
  # them into image config labels for compatibility with label-based tooling.
  OCI_SOURCE: https://github.com/cattr-app/server-application
  OCI_VENDOR: Cattr

  SERVER_DESCRIPTION: >-
    Cattr server application - self-hosted time tracking with project management,
    reports, screenshots, activity tracking and public API

  RUNTIME_DESCRIPTION: >-
    Cattr server runtime image with PHP 8.3, Nginx and Pebble on Wolfi

  BUILDER_DESCRIPTION: >-
    Cattr server build image with PHP 8.3, Composer, Node.js and Corepack on Wolfi

jobs:
  release-metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # checkout only
    outputs:
      version: ${{ steps.classify.outputs.version }}
      stable: ${{ steps.classify.outputs.stable }}
      application_tags: ${{ steps.classify.outputs.application_tags }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Classify SemVer tag
        id: classify
        run: bash scripts/release-tags.sh

  runtime-images:
    name: Prepare runtime images

    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: release-metadata

    permissions:
      contents: read  # checkout
      packages: write  # push runtime/builder images to GHCR
      id-token: write  # OIDC token for Sigstore signing of attestations
      attestations: write  # store build provenance attestations

    # step-security/harden-runner is not used here: it does not support jobs
    # that run entirely in a `container:` on GitHub-hosted runners (it needs
    # sudo on the runner VM). See
    # https://github.com/step-security/harden-runner/blob/main/docs/limitations.md
    container:
      # ghcr.io/wolfi-dev/sdk:latest as used by the v4.0.1 release
      # (apko v1.4.12, melange v0.63.0). The full `apko version` and
      # `melange version` output feeds into the runtime/builder image tags,
      # so changing this digest triggers a rebuild of the base images.
      image: ghcr.io/wolfi-dev/sdk@sha256:74863718530747316d12ce3dc116108143a3bac483db0b3a985b25babfdb1a19

      # Required by the bubblewrap runner used by Melange.
      options: --privileged

    defaults:
      run:
        shell: bash

    outputs:
      image: ${{ steps.meta.outputs.image }}
      runtime_tag: ${{ steps.meta.outputs.runtime_tag }}
      builder_tag: ${{ steps.meta.outputs.builder_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b  # v0.7
        with:
          version: v0.22.1

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" |
            crane auth login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Show build tool versions
        run: |
          set -euo pipefail

          apko version
          melange version
          crane version

      - name: Calculate runtime image metadata
        id: meta
        env:
          RUNTIME_FILES_HASH: ${{ hashFiles(
            'build/base/runtime/**',
            'build/packages/php83.yaml',
            'build/packages/caddy.yaml',
            'build/packages/pebble.yaml',
            'build/base/rebuild'
            ) }}
          BUILDER_FILES_HASH: ${{ hashFiles(
            'build/base/builder/**',
            'build/packages/php83.yaml',
            'build/packages/nodejs-24.yaml',
            'build/packages/pebble.yaml',
            'build/packages/composer.yaml',
            'build/packages/corepack.yaml',
            'build/base/rebuild'
            ) }}
        run: |
          set -euo pipefail

          for file in \
            "${RUNTIME_CONFIG}" \
            "${BUILDER_CONFIG}" \
            "${PHP_CONFIG}" \
            "${CADDY_CONFIG}" \
            "${NODEJS_CONFIG}" \
            "${PEBBLE_CONFIG}" \
            "${COMPOSER_CONFIG}" \
            "${COREPACK_CONFIG}"
          do
            if [[ ! -f "${file}" ]]; then
              echo "::error::Required build configuration not found: ${file}"
              exit 1
            fi
          done

          runtime_files_hash="${RUNTIME_FILES_HASH}"
          builder_files_hash="${BUILDER_FILES_HASH}"

          if [[ -z "${runtime_files_hash}" ]]; then
            echo "::error::Unable to calculate runtime configuration hash"
            exit 1
          fi

          if [[ -z "${builder_files_hash}" ]]; then
            echo "::error::Unable to calculate builder configuration hash"
            exit 1
          fi

          apko_version="$(apko version 2>&1 | tr '\n' ' ')"
          melange_version="$(melange version 2>&1 | tr '\n' ' ')"

          # Keep the OCI revision of immutable base images tied to the last
          # commit that actually changed their build inputs, rather than to
          # every unrelated Cattr application release.
          runtime_revision="$(
            git log \
              -1 \
              --format='%H' \
              -- \
              "${RUNTIME_CONFIG}" \
              "${PHP_CONFIG}" \
              "${CADDY_CONFIG}" \
              "${PEBBLE_CONFIG}" \
              build/base/rebuild
          )"

          builder_revision="$(
            git log \
              -1 \
              --format='%H' \
              -- \
              "${BUILDER_CONFIG}" \
              "${PHP_CONFIG}" \
              "${NODEJS_CONFIG}" \
              "${PEBBLE_CONFIG}" \
              "${COMPOSER_CONFIG}" \
              "${COREPACK_CONFIG}" \
              build/base/rebuild
          )"

          if [[ -z "${runtime_revision}" ]]; then
            echo "::error::Unable to determine runtime source revision"
            exit 1
          fi

          if [[ -z "${builder_revision}" ]]; then
            echo "::error::Unable to determine builder source revision"
            exit 1
          fi

          # Static OCI metadata is part of the image identity as changing it
          # changes the resulting OCI manifest/config digest.
          runtime_hash="$(
            printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              "${IMAGE_BUILD_REVISION}" \
              "${apko_version}" \
              "${melange_version}" \
              "${runtime_files_hash}" \
              "${OCI_SOURCE}" \
              "${OCI_VENDOR}" \
              "${RUNTIME_DESCRIPTION}" |
              sha256sum |
              cut -d' ' -f1
          )"

          builder_hash="$(
            printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              "${IMAGE_BUILD_REVISION}" \
              "${apko_version}" \
              "${melange_version}" \
              "${builder_files_hash}" \
              "${OCI_SOURCE}" \
              "${OCI_VENDOR}" \
              "${BUILDER_DESCRIPTION}" |
              sha256sum |
              cut -d' ' -f1
          )"

          runtime_tag="runtime-${runtime_hash}"
          builder_tag="builder-${builder_hash}"

          {
            echo "image=${RUNTIME_IMAGE}"
            echo "runtime_tag=${runtime_tag}"
            echo "runtime_revision=${runtime_revision}"
            echo "builder_tag=${builder_tag}"
            echo "builder_revision=${builder_revision}"
          } >> "${GITHUB_OUTPUT}"

          echo "Runtime image:"
          echo "  ${RUNTIME_IMAGE}:${runtime_tag}"

          echo "Builder image:"
          echo "  ${RUNTIME_IMAGE}:${builder_tag}"

      - name: Check existing runtime images
        id: check
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
        run: |
          set -euo pipefail

          if crane manifest --platform linux/amd64 "${RUNTIME_IMAGE}:${RUNTIME_TAG}" >/dev/null 2>&1 &&
             crane validate --platform linux/amd64 --remote "${RUNTIME_IMAGE}:${RUNTIME_TAG}" >/dev/null 2>&1; then
            echo "Runtime image already exists."
            echo "runtime_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Runtime image does not exist."
            echo "runtime_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if crane manifest --platform linux/amd64 "${RUNTIME_IMAGE}:${BUILDER_TAG}" >/dev/null 2>&1 &&
             crane validate --platform linux/amd64 --remote "${RUNTIME_IMAGE}:${BUILDER_TAG}" >/dev/null 2>&1; then
            echo "Builder image already exists."
            echo "builder_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Builder image does not exist."
            echo "builder_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build local APK repository
        if: steps.check.outputs.runtime_exists != 'true' || steps.check.outputs.builder_exists != 'true'
        env:
          PACKAGE_REPOSITORY: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail

          MELANGE_PRIVATE_KEY="${RUNNER_TEMP}/melange.rsa"
          MELANGE_PUBLIC_KEY="${RUNNER_TEMP}/melange.rsa.pub"

          rm -rf "${PACKAGE_REPOSITORY}"

          rm -f \
            "${MELANGE_PRIVATE_KEY}" \
            "${MELANGE_PUBLIC_KEY}"

          melange keygen "${MELANGE_PRIVATE_KEY}"

          # Build the packages that depend only on Wolfi or upstream release
          # artifacts first. Composer and Corepack are intentionally built in
          # the next phase because their metapackage dependencies must be
          # available in the local repository.
          for config in \
            "${PHP_CONFIG}" \
            "${CADDY_CONFIG}" \
            "${NODEJS_CONFIG}" \
            "${PEBBLE_CONFIG}"
          do
            melange build \
              "${config}" \
              --runner bubblewrap \
              --arch x86_64 \
              --out-dir "${PACKAGE_REPOSITORY}" \
              --signing-key "${MELANGE_PRIVATE_KEY}" \
              --generate-index=false \
              --namespace cattr \
              --license MIT \
              --git-repo-url "${OCI_SOURCE}" \
              --git-commit "${GITHUB_SHA}"
          done

          # Make the first-phase packages available to dependent builds.
          melange index \
            --arch x86_64 \
            --output "${PACKAGE_REPOSITORY}/x86_64/APKINDEX.tar.gz" \
            --signing-key "${MELANGE_PRIVATE_KEY}" \
            "${PACKAGE_REPOSITORY}/x86_64/"*.apk

          for config in \
            "${COMPOSER_CONFIG}" \
            "${COREPACK_CONFIG}"
          do
            melange build \
              "${config}" \
              --runner bubblewrap \
              --arch x86_64 \
              --out-dir "${PACKAGE_REPOSITORY}" \
              --repository-append "${PACKAGE_REPOSITORY}" \
              --keyring-append "${MELANGE_PUBLIC_KEY}" \
              --signing-key "${MELANGE_PRIVATE_KEY}" \
              --generate-index=false \
              --namespace cattr \
              --license MIT \
              --git-repo-url "${OCI_SOURCE}" \
              --git-commit "${GITHUB_SHA}"
          done

          # Rebuild one signed index containing all local packages.
          melange index \
            --arch x86_64 \
            --output "${PACKAGE_REPOSITORY}/x86_64/APKINDEX.tar.gz" \
            --signing-key "${MELANGE_PRIVATE_KEY}" \
            "${PACKAGE_REPOSITORY}/x86_64/"*.apk

          echo "Generated APK repository:"

          find "${PACKAGE_REPOSITORY}" \
            -maxdepth 2 \
            -type f \
            -print

      - name: Build and publish runtime image
        id: publish_runtime
        if: steps.check.outputs.runtime_exists != 'true'
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
          RUNTIME_REVISION: ${{ steps.meta.outputs.runtime_revision }}
          PACKAGE_REPOSITORY: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail

          MELANGE_PUBLIC_KEY="${RUNNER_TEMP}/melange.rsa.pub"

          echo "Publishing ${RUNTIME_IMAGE}:${RUNTIME_TAG}"

          apko publish \
            --vcs=false \
            --repository-append "${PACKAGE_REPOSITORY}" \
            --keyring-append "${MELANGE_PUBLIC_KEY}" \
            --annotations "\"org.opencontainers.image.source:${OCI_SOURCE}\"" \
            --annotations "\"org.opencontainers.image.revision:${RUNTIME_REVISION}\"" \
            --annotations "\"org.opencontainers.image.version:${RUNTIME_TAG}\"" \
            --annotations "\"org.opencontainers.image.vendor:${OCI_VENDOR}\"" \
            --annotations "\"org.opencontainers.image.description:${RUNTIME_DESCRIPTION}\"" \
            "${RUNTIME_CONFIG}" \
            "${RUNTIME_IMAGE}:${RUNTIME_TAG}"

          digest="$(
            crane digest "${RUNTIME_IMAGE}:${RUNTIME_TAG}"
          )"

          echo "Published:"
          echo "  ${RUNTIME_IMAGE}:${RUNTIME_TAG}@${digest}"

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Validate published runtime image
        if: steps.check.outputs.runtime_exists != 'true'
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
        run: |
          set -euo pipefail
          image="${RUNTIME_IMAGE}:${RUNTIME_TAG}"
          crane manifest --platform linux/amd64 "${image}" >/dev/null
          crane validate --platform linux/amd64 --remote "${image}"

      - name: Attest runtime image
        if: steps.check.outputs.runtime_exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.RUNTIME_IMAGE }}
          subject-digest: ${{ steps.publish_runtime.outputs.digest }}

      - name: Build and publish builder image
        id: publish_builder
        if: steps.check.outputs.builder_exists != 'true'
        env:
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
          BUILDER_REVISION: ${{ steps.meta.outputs.builder_revision }}
          PACKAGE_REPOSITORY: ${{ github.workspace }}/packages
        run: |
          set -euo pipefail

          MELANGE_PUBLIC_KEY="${RUNNER_TEMP}/melange.rsa.pub"

          echo "Publishing ${RUNTIME_IMAGE}:${BUILDER_TAG}"

          apko publish \
            --vcs=false \
            --repository-append "${PACKAGE_REPOSITORY}" \
            --keyring-append "${MELANGE_PUBLIC_KEY}" \
            --annotations "\"org.opencontainers.image.source:${OCI_SOURCE}\"" \
            --annotations "\"org.opencontainers.image.revision:${BUILDER_REVISION}\"" \
            --annotations "\"org.opencontainers.image.version:${BUILDER_TAG}\"" \
            --annotations "\"org.opencontainers.image.vendor:${OCI_VENDOR}\"" \
            --annotations "\"org.opencontainers.image.description:${BUILDER_DESCRIPTION}\"" \
            "${BUILDER_CONFIG}" \
            "${RUNTIME_IMAGE}:${BUILDER_TAG}"

          digest="$(
            crane digest "${RUNTIME_IMAGE}:${BUILDER_TAG}"
          )"

          echo "Published:"
          echo "  ${RUNTIME_IMAGE}:${BUILDER_TAG}@${digest}"

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Validate published builder image
        if: steps.check.outputs.builder_exists != 'true'
        env:
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
        run: |
          set -euo pipefail
          image="${RUNTIME_IMAGE}:${BUILDER_TAG}"
          crane manifest --platform linux/amd64 "${image}" >/dev/null
          crane validate --platform linux/amd64 --remote "${image}"

      - name: Attest builder image
        if: steps.check.outputs.builder_exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.RUNTIME_IMAGE }}
          subject-digest: ${{ steps.publish_builder.outputs.digest }}

      - name: Update runtime-latest
        if: needs.release-metadata.outputs.stable == 'true'
        env:
          RUNTIME_TAG: ${{ steps.meta.outputs.runtime_tag }}
        run: |
          set -euo pipefail

          crane tag \
            "${RUNTIME_IMAGE}:${RUNTIME_TAG}" \
            runtime-latest

          crane manifest --platform linux/amd64 "${RUNTIME_IMAGE}:runtime-latest" >/dev/null
          crane validate --platform linux/amd64 --remote "${RUNTIME_IMAGE}:runtime-latest"
          test "$(crane digest "${RUNTIME_IMAGE}:${RUNTIME_TAG}")" = "$(crane digest "${RUNTIME_IMAGE}:runtime-latest")"

      - name: Update builder-latest
        if: needs.release-metadata.outputs.stable == 'true'
        env:
          BUILDER_TAG: ${{ steps.meta.outputs.builder_tag }}
        run: |
          set -euo pipefail

          crane tag \
            "${RUNTIME_IMAGE}:${BUILDER_TAG}" \
            builder-latest

          crane manifest --platform linux/amd64 "${RUNTIME_IMAGE}:builder-latest" >/dev/null
          crane validate --platform linux/amd64 --remote "${RUNTIME_IMAGE}:builder-latest"
          test "$(crane digest "${RUNTIME_IMAGE}:${BUILDER_TAG}")" = "$(crane digest "${RUNTIME_IMAGE}:builder-latest")"

  application:
    name: Build server

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    needs:
      - release-metadata
      - runtime-images

    permissions:
      contents: read  # checkout
      packages: write  # push the server image to GHCR
      id-token: write  # OIDC token for Sigstore signing of attestations
      attestations: write  # store build provenance attestations

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build Cattr server
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034  # v3.1.0
        with:
          context: .

          containerfiles: |
            ./Dockerfile

          image: ${{ env.APP_IMAGE }}

          tags: ${{ needs.release-metadata.outputs.application_tags }}

          # Cattr images are intentionally linux/amd64 only.
          arch: amd64

          # org.opencontainers.image.* metadata is emitted as OCI annotations.
          oci: true

          build-args: |
            APP_VERSION=${{ needs.release-metadata.outputs.version }}

            BUILDER_BASE_IMAGE=${{ needs.runtime-images.outputs.image }}
            BUILDER_BASE_IMAGE_TAG=${{ needs.runtime-images.outputs.builder_tag }}

            RUNTIME_BASE_IMAGE=${{ needs.runtime-images.outputs.image }}
            RUNTIME_BASE_IMAGE_TAG=${{ needs.runtime-images.outputs.runtime_tag }}

          annotations: |
            org.opencontainers.image.source=${{ env.OCI_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.version }}
            org.opencontainers.image.vendor=${{ env.OCI_VENDOR }}
            org.opencontainers.image.description=${{ env.SERVER_DESCRIPTION }}

          layers: true

      - name: Push Cattr server
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}

          registry: ${{ env.REGISTRY_NAMESPACE }}

          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Cattr server
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_NAMESPACE }}/${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Print published images
        shell: bash
        env:
          REGISTRY_PATHS: ${{ steps.push.outputs.registry-paths }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          echo "Published:"
          echo "${REGISTRY_PATHS}"

          echo "Digest:"
          echo "${DIGEST}"
