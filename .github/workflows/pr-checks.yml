name: PR checks

# Required PR checks (Dependency Review, actionlint, Hadolint, Trivy config,
# Helm chart, zizmor). No workflow-level `paths` filters on purpose: required
# checks must report on every pull request.

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    # Diff-based check: it compares the PR head with its base, so it only
    # applies to pull requests. On push the job is skipped (reported as
    # successful for required checks).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # Results go to the job summary; posting a PR comment would need
          # `pull-requests: write`, which fork PRs do not get anyway.
          comment-summary-in-pr: never

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Lints every file under .github/workflows (actionlint's default when
      # run from the repository root); the image bundles shellcheck.
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # 1.7.12
        with:
          args: -color

  hadolint:
    name: Hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Picks up .hadolint.yaml from the repository root.
      - name: Lint Dockerfile
        uses: docker://hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d  # v2.15.1
        with:
          args: hadolint Dockerfile

  trivy-config:
    name: Trivy config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Trivy runs from the official image pinned by digest instead of
      # aquasecurity/trivy-action / setup-trivy: those actions had their tags
      # hijacked in March 2026 (GHSA-69fq-xp46-6x23). 0.76.1 is newer than every
      # affected release and patched for all published trivy advisories
      # (latest fix: 0.72.0); the digest is immutable regardless of tags.
      #
      # Misconfiguration scanning only (Dockerfile, Helm chart, other IaC).
      # Vulnerabilities are covered by Dependency Review / Dependabot and
      # secrets by GitHub secret scanning; see issue #339.
      #
      # --helm-set: the chart fails to render without its required keys, and
      # Trivy then silently skips the Helm templates. Dummy values keep the
      # chart covered (APP_KEY must decode to 32 bytes); mysql.enabled=true
      # also renders the built-in MySQL templates.
      - name: Scan configuration
        uses: docker://aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c  # 0.76.1
        with:
          args: >-
            fs
            --scanners misconfig
            --severity MEDIUM,HIGH,CRITICAL
            --ignorefile .trivyignore.yaml
            --helm-set cattr.appUrl=https://cattr.example.com,cattr.appKey=base64:Y2ktZHVtbXktYXBwLWtleS0zMi1ieXRlcy1sb25nISE=,cattr.reverbAppSecret=ci-dummy,mysql.enabled=true,database.username=ci-dummy,database.password=ci-dummy,database.rootPassword=ci-dummy,setup.admin.enabled=false
            --exit-code 1
            --no-progress
            .

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # helm lint --strict, helm template for every .helm/ci/*-values.yaml
      # (rendered twice, must be identical), kubeconform -strict for
      # Kubernetes 1.29 and 1.34, and renders that must fail. alpine/k8s
      # bundles helm 4 and kubeconform; pinned by digest.
      - name: Lint, render and validate
        uses: docker://alpine/k8s@sha256:d50424976a0a888d2531f13035dce45c004ec2b6f877f233005ba35c0d61be5d  # 1.34.12
        with:
          entrypoint: sh
          args: .helm/ci/check.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9  # 1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Blocking. The first run writes the full report to the job summary
      # and never fails (--no-exit-codes), so the summary is there even when
      # the audit fails; the second run emits findings as annotations and
      # fails the job on any finding (default persona). Accepted exceptions
      # live in .github/zizmor.yml or in documented inline
      # `# zizmor: ignore[...]` comments. The read-only token is enough for
      # the online audits and is what fork PRs get anyway.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo '## zizmor findings'
            echo
            echo '```'
            docker run --rm -e GH_TOKEN -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
              "${ZIZMOR_IMAGE}" --format plain --color never --render-links never \
              --show-audit-urls always --no-exit-codes .
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          docker run --rm -e GH_TOKEN -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            "${ZIZMOR_IMAGE}" --format github .

      # zizmor's unpinned-images only reports untagged / `latest` images at
      # the default persona (a tag without a digest is a pedantic finding),
      # so digest pins are enforced here: job `container` images, `services`
      # images and `docker://` step references must contain `@sha256:`.
      # Images passed to `docker run` through env vars are not covered.
      - name: Check image digests
        run: |
          set -euo pipefail
          status=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            refs="$(yq -r '
              .jobs[] |
              ((.container | select(tag == "!!str")),
               .container.image,
               .services[].image,
               (.steps[].uses | select(. != null and test("^docker://"))))
              | select(. != null)
            ' "$file")"
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in
                *@sha256:*) ;;
                *)
                  echo "::error file=${file}::Image is not pinned by digest: ${ref}"
                  status=1
                  ;;
              esac
            done <<< "$refs"
          done
          exit "$status"

  zizmor-sarif:
    name: zizmor SARIF upload
    # Code scanning upload needs `security-events: write`, which fork PRs
    # never get; findings from PRs are shown by the job above instead.
    # --no-exit-codes: the SARIF must be uploaded even when there are
    # findings, so this job never fails on them (the zizmor job does).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # Upload SARIF to GitHub code scanning.
    env:
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9  # 1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker run --rm -e GH_TOKEN -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            "${ZIZMOR_IMAGE}" --format sarif --no-exit-codes . > "${RUNNER_TEMP}/zizmor.sarif"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
