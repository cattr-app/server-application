name: Release checks

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'scripts/release-tags.sh'
      - 'tests/ci/release-tags.sh'
  push:
    branches:
      - release/4.0
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - 'scripts/release-tags.sh'
      - 'tests/ci/release-tags.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test release tag classification
        run: bash tests/ci/release-tags.sh
