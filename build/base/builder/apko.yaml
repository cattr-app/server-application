contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

  repositories:
    - https://packages.wolfi.dev/os

  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle

    - git
    - openssh-client

    # Local metapackages pin the runtime versions used for the Cattr build.
    - php83-builder
    - nodejs-local
    - corepack-local
    - composer-local

environment:
  HOME: /opt/cattr
  PATH: /usr/sbin:/sbin:/bin:/usr/bin:/opt/cattr/app/node_modules/.bin

paths:
  - path: /opt/cattr
    type: directory
    permissions: 0o750
    uid: 10000
    gid: 10000

  - path: /opt/cattr
    type: directory
    permissions: 0o755
    uid: 10000
    gid: 10000

  - path: /opt/cattr/app
    type: directory
    permissions: 0o770
    uid: 10000
    gid: 10000

work-dir: /opt/cattr/app

accounts:
  groups:
    - groupname: cattr
      gid: 10000

  users:
    - username: cattr
      uid: 10000
      gid: 10000

  run-as: 10000

entrypoint:
  command: /bin/sh

archs:
  - amd64
