contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

  repositories:
    - https://packages.wolfi.dev/os

  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle

    - pebble
    - supercronic=0.2.49-r3
    - nginx-mainline=1.31.6-r0

    # Local metapackage pins PHP and all required extensions.
    - php83-local

environment:
  HOME: /opt/cattr
  PATH: /usr/sbin:/sbin:/bin:/usr/bin

paths:
  - path: /opt/cattr
    type: directory
    permissions: 0o750
    uid: 10000
    gid: 10000

  - path: /opt/cattr/.pebble
    type: directory
    permissions: 0o750
    uid: 10000
    gid: 10000

  - path: /opt/cattr/.pebble/layers
    type: directory
    permissions: 0o750
    uid: 10000
    gid: 10000

  - path: /opt/cattr
    type: directory
    permissions: 0o755
    uid: 0
    gid: 0

  - path: /opt/cattr/app
    type: directory
    permissions: 0o755
    uid: 0
    gid: 0

work-dir: /opt/cattr/app

accounts:
  groups:
    - groupname: cattr
      gid: 10000

  users:
    - username: cattr
      uid: 10000
      gid: 10000

  # The base image itself is already non-root. The final Dockerfile keeps the
  # same UID/GID and never switches to root at container startup.
  run-as: 10000

# This is a base image. The Cattr application image defines its real entrypoint.
entrypoint:
  command: /bin/sh

archs:
  - amd64
