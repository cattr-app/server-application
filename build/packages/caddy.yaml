package:
  name: caddy-local
  version: "2.11.7"
  epoch: 0

  description: Caddy HTTP server built from upstream source for Cattr

  target-architecture:
    - x86_64

  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 72dd0fb067f6d7826c7f79907670ba4a713bfe37
      repository: https://github.com/caddyserver/caddy
      tag: v${{package.version}}

  - runs: install -m644 -D LICENSE "${{targets.destdir}}/usr/share/licenses/caddy-local/LICENSE"

  - uses: go/build
    with:
      output: caddy
      packages: ./cmd/caddy
      go-package: go-1.26

test:
  pipeline:
    - name: Check required HTTP modules
      runs: |
        set -eu
        caddy version
        caddy list-modules | grep -Fx http.handlers.file_server
        caddy list-modules | grep -Fx http.handlers.reverse_proxy
