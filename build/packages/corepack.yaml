package:
  name: corepack-local
  version: "0.36.0"
  epoch: 0

  description: Corepack package manager bridge for Node.js

  target-architecture:
    - x86_64

  copyright:
    - license: MIT

  dependencies:
    runtime:
      - nodejs-local

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os

    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/nodejs/corepack/releases/download/v${{package.version}}/corepack.tgz
      expected-sha256: 9128cfe26aee0c99f4fc68c15c6b8b12309a68be0de2c012cdfea2a463cb722f
      delete: "true"

  - name: Install Corepack
    runs: |
      set -eu

      module_dir="${{targets.destdir}}/usr/lib/node_modules/corepack"
      bin_dir="${{targets.destdir}}/usr/bin"

      mkdir -p "${module_dir}" "${bin_dir}"

      cp -a package.json LICENSE.md dist "${module_dir}/"

      chmod 0755 \
        "${module_dir}/dist/corepack.js" \
        "${module_dir}/dist/pnpm.js" \
        "${module_dir}/dist/pnpx.js" \
        "${module_dir}/dist/yarn.js" \
        "${module_dir}/dist/yarnpkg.js"

      ln -s ../lib/node_modules/corepack/dist/corepack.js "${bin_dir}/corepack"
      ln -s ../lib/node_modules/corepack/dist/pnpm.js "${bin_dir}/pnpm"
      ln -s ../lib/node_modules/corepack/dist/pnpx.js "${bin_dir}/pnpx"
      ln -s ../lib/node_modules/corepack/dist/yarn.js "${bin_dir}/yarn"
      ln -s ../lib/node_modules/corepack/dist/yarnpkg.js "${bin_dir}/yarnpkg"

test:
  environment:
    contents:
      repositories:
        - https://packages.wolfi.dev/os

      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

      packages:
        - nodejs-local

  pipeline:
    - name: Check Corepack
      runs: |
        set -eu
        test "$(corepack --version)" = "${{package.version}}"
